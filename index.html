function showPasscode(){document.getElementById('passcode').classList.add('show')}
function hidePasscode(){document.getElementById('passcode').classList.remove('show')}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n=>`<button class="key" onclick="keyPress('${n}')">${n==='⌫'?'⌫':n}<small>${[2,3,4,5,6,7,8,9].includes(n)?({2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'}[n]):''}</small></button>`).join('');
let entered='';
function keyPress(n){
  if(n==='⌫') entered=entered.slice(0,-1); else if(n!=='') { if(entered.length<4) entered+=n; }
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('filled',i<entered.length));
  const hint=document.getElementById('passcodeHint'); if(hint) hint.textContent='输入 iPhone 密码以继续';
  if(entered.length===4){
    if(entered==='0526'){
      if(hint) hint.textContent='密码正确';
      setTimeout(()=>{hidePasscode();entered='';document.querySelectorAll('.dot').forEach(d=>d.classList.remove('filled'));document.getElementById('lockView').classList.remove('active');document.getElementById('homeView').classList.add('active');state.unlocked=true;save();showToast('欢迎回来，雨桐');},260);
    }else{
      const box=document.getElementById('passcode');box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');if(hint)hint.textContent='密码错误，请重试';setTimeout(()=>{entered='';document.querySelectorAll('.dot').forEach(d=>d.classList.remove('filled'));box.classList.remove('shake');},550);
    }
  }
}

document.getElementById('statusTime').textContent=timeNow();document.querySelector('.home-date').textContent=timeNow();document.getElementById('lockClock').textContent=timeNow();document.getElementById('lockNotifs').innerHTML='<div class="lock-notif"><b>聊天 · 徐明浩　现在</b><br>雨桐，你到家了吗？</div><div class="lock-notif"><b>投屏一 · 备忘提醒</b><br>别忘了把今天拍的照片备份。</div>';showView('lockView');
// The home screen itself is the default entry point. Long-press the status bar to preview the lock screen.
let pressTimer;document.querySelector('.status').addEventListener('touchstart',()=>pressTimer=setTimeout(lockPhone,650));document.querySelector('.status').addEventListener('touchend',()=>clearTimeout(pressTimer));document.querySelector('.status').addEventListener('dblclick',lockPhone);
